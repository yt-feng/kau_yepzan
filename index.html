<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yutong Feng | Language Practice, Chinese Courses, and Translation</title>
    <meta name="description" content="Short-video English practice, structured Chinese courses, and Arabic-to-Chinese translation support." />
    <meta name="theme-color" content="#050816" />
    <link rel="stylesheet" href="./styles.css" />
    <script defer src="./translations.js"></script>
    <script defer src="./main.js"></script>
  </head>
  <body data-page="home">
    <header class="site-header">
      <div class="container nav-shell">
        <a class="brand" href="index.html">
          <strong id="brandName">Yutong Feng</strong>
          <span id="brandTagline">Language practice · Chinese courses</span>
        </a>

        <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="Toggle navigation">
          <span></span><span></span><span></span>
        </button>

        <nav id="site-nav" class="site-nav" aria-label="Primary navigation">
          <a id="navHome" href="index.html">Home</a>
          <a id="navLearn" href="learn.html">Learn</a>
          <a id="navProducts" href="products.html">Products</a>
          <a id="navCheckout" href="order.html?product=bundle">Inquiry</a>
          <a id="navContact" href="#contact">Contact</a>
        </nav>

        <div class="lang-switch" aria-label="Language switcher">
          <label id="langLabel" for="lang-en">Language</label>
          <button id="lang-en" class="lang-btn" type="button" data-lang="en">EN</button>
          <button class="lang-btn" type="button" data-lang="zh">中</button>
          <button class="lang-btn" type="button" data-lang="ar">AR</button>
        </div>
      </div>
    </header>

    <main>
      <section class="section">
        <div class="container hero-grid">
          <div id="heroMount"></div>
        </div>
      </section>

      <section class="section section-tight">
        <div class="container">
          <div class="section-head">
            <span class="eyebrow" id="proofTitle"></span>
            <p id="proofLead"></p>
          </div>
          <div id="proofGrid" class="grid-3"></div>
        </div>
      </section>

      <section class="section">
        <div class="container">
          <div class="section-head">
            <h2 id="featuredTitle"></h2>
            <p id="featuredLead"></p>
          </div>
          <div id="featuredGrid" class="product-grid"></div>
        </div>
      </section>

      <section class="section section-tight">
        <div class="container">
          <div id="videoLearnTeaser" class="video-teaser"></div>
        </div>
      </section>

      <section class="section">
        <div class="container">
          <div class="section-head">
            <h2 id="methodTitle"></h2>
          </div>
          <div id="methodGrid" class="grid-3"></div>
        </div>
      </section>

      <section class="section">
        <div class="container">
          <div class="section-head">
            <h2 id="testimonialTitle"></h2>
          </div>
          <div id="testimonialGrid" class="grid-3"></div>
        </div>
      </section>

      <section class="section">
        <div class="container">
          <div class="section-head">
            <h2 id="faqTitle"></h2>
          </div>
          <div id="faqList" class="faq-stack"></div>
        </div>
      </section>

      <section id="contact" class="section">
        <div class="container">
          <div class="final-card">
            <h2 id="finalTitle"></h2>
            <p id="finalLead"></p>
            <div class="hero-actions">
              <a id="finalProductsButton" class="button button-primary" href="products.html">Browse catalog</a>
              <a id="finalOrderButton" class="button button-secondary" href="checkout.html?product=bundle">Order now</a>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <div class="container footer-grid">
        <div class="footer-panel">
          <p id="footerNote"></p>
        </div>
        <div class="footer-panel">
          <div class="panel-head panel-head-tight">
            <span class="eyebrow" id="footerContactTitle"></span>
            <p id="footerContactLead"></p>
          </div>
          <div class="footer-links">
            <div>
              <small id="footerEmailLabel">Email</small>
              <a id="footerEmailLink" href="mailto:yt.feng@foxmail.com">yt.feng@foxmail.com</a>
            </div>
            <div>
              <small id="footerWhatsappLabel">WhatsApp</small>
              <a id="footerWhatsappLink" href="https://wa.me/8618717802869">+86 187 1780 2869</a>
            </div>
            <div>
              <small id="footerLinkedinLabel">LinkedIn</small>
              <a id="footerLinkedinLink" href="https://www.linkedin.com/in/yt-feng/" target="_blank" rel="noreferrer">yt-feng</a>
            </div>
            <small>© <span id="year"></span> Yutong Feng</small>
          </div>
        </div>
      </div>
    </footer>
  </body>
</html>
